name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Secret hygiene
        run: node scripts/check-secrets.mjs
      - name: Typecheck, lint and regression tests
        run: npm run check
      - name: Production build and PWA generation
        run: npm run build
      - name: Dependency audit (high and critical only)
        run: npm audit --audit-level=high --omit=dev
